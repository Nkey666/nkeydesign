# nginx reverse proxy для Next.js (next start слушает 127.0.0.1:3000)
# Положить в /etc/nginx/sites-available/nkeydesign и слинковать в sites-enabled.
# HTTPS-блок (:443) автоматически допишет certbot — здесь только :80.

server {
    listen 80;
    listen [::]:80;
    server_name nkeydesign.ru www.nkeydesign.ru;

    # Отдаём заголовок реального протокола, чтобы Next знал про HTTPS за прокси
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Длинный кэш для статики Next
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
